plugins {
	id "fabric-loom" version "1.10.+"
	id "maven-publish"
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '17'

def buildNumberFile = file('build-number.properties')
def buildNumberState = new Properties()
if (buildNumberFile.exists()) {
	buildNumberFile.withInputStream { buildNumberState.load(it) }
}
def storedVersion = buildNumberState.getProperty('mod_version', '')
def storedBuildNumber = storedVersion == mod_version ? buildNumberState.getProperty('build_number', '0').toInteger() : 0
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def createsReleaseJar = requestedTaskNames.any { it in ['build', 'assemble', 'remapJar'] }
def ciBuildNumber = System.getenv('GITHUB_RUN_NUMBER')
def automaticBuildNumber = createsReleaseJar ? storedBuildNumber + 1 : Math.max(storedBuildNumber, 1)
def resolvedBuildNumber = ciBuildNumber ?: automaticBuildNumber

version = "${mod_version}-build.${resolvedBuildNumber}"
archivesBaseName = "${project.archives_base_name}-fabric"
group = project.maven_group

repositories {
	maven { url "https://maven.latvian.dev/releases" }
	maven { url "https://maven.architectury.dev" }
	maven { url "https://maven.createmod.net/" }
	maven { url "https://maven.blamejared.com/" }
	maven {
		url "https://maven.saps.dev/releases"
	}

	// the maven for the devOS repo, for create fabric
	// (and a bunch of libraries I'm assuming)
	maven { url "https://mvn.devos.one/snapshots/" }
	maven { url "https://mvn.devos.one/releases/" }

	maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes

	maven {
		url "https://maven.tterrag.com/"
		content {
			includeGroup "com.jozufozu.flywheel"
		}
	}

	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}

	// jitpack?! why?!
	maven {
		url "https://jitpack.io/"
		content {
			includeGroup "com.github.LlamaLad7"
			includeGroup "com.github.llamalad7.mixinextras" // two different versions of mixinextras on the classpath?? WHY?!
			includeGroup "com.github.Chocohead"
			includeGroup "com.github.Draylar.omega-config"
		}
	}

	// "i play both sides, that way i always come out ahead"
	maven {
		url "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings loom.officialMojangMappings()

	modApi("net.fabricmc:fabric-loader:${rootProject.loader_version}")
	modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}")

	modApi "dev.latvian.mods:kubejs-fabric:${rootProject.kubejs_version}"
	modApi "com.simibubi.create:create-fabric:${rootProject.create_version}"
	modApi "io.github.fabricators_of_create.Porting-Lib:transfer:2.3.13+1.20.1"
	modApi "com.tterrag.registrate_fabric:Registrate:1.3.79-MC1.20.1"
	modApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.0")

	modLocalRuntime modCompileOnly("curse.maven:jei-238222:5440260")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	withSourcesJar()
}

jar {
	archiveClassifier.set "dev"
}

remapJar {
    archiveBaseName.set "${rootProject.archives_base_name}-fabric"
    archiveClassifier.set null

	doLast {
		if (ciBuildNumber == null && createsReleaseJar) {
			buildNumberFile.text = "mod_version=${mod_version}${System.lineSeparator()}build_number=${automaticBuildNumber}${System.lineSeparator()}"
		}
	}
}

publishing {
	publications {
		mavenFabric(MavenPublication) {
			artifactId = rootProject.archivesBaseName
			from components.java
		}
	}
}



